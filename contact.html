    <header>

    <main class="container page-padding">
        <h1 class="page-title reveal">Secure Your Private Viewing</h1>
        
        <div class="contact-wrapper reveal">
            <div class="contact-info">
                <h3>Corporate Details</h3>
                <p><strong>Location:</strong> Kampala, Uganda</p>
                <p><strong>Phone:</strong> +256 781 174419</p>

                <input type="email" placeholder="Your Email Address" required>
                <textarea rows="5" placeholder="Which model or asset configuration are you inquiring about?" required></textarea>
                <button type="submit" class="gold-btn">Submit Inquiry</button>
            </form>
        </div>
